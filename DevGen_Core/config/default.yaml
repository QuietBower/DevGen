# Model configuration
models:
  deepseek:
    api_base: "https://api.deepseek.com" # Model service endpoint
    available_models:
      - "deepseek-chat"
      - "deepseek-reasoner"
    default_model: "deepseek-chat" # Default model
    max_tokens: 8192 # Maximum context length
    api_key: "" # API key
  qwen:
    api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    available_models: 
      - "qwen3-max"
      - "qwen3-max-preview"
    default_model: "qwen3-max"
    max_tokens: 65536
    api_key: ""
  gpt:
    api_base: "https://yunwu.zeabur.app/v1/"
    available_models:
      - "gpt-5.1"
    default_model: "gpt-5.1"
    max_tokens: 128000
    api_key: ""
  glm:
    api_base: "https://open.bigmodel.cn/api/paas/v4/"
    default_model: "glm-4.6"
    max_tokens: 131072
    api_key: ""
  siliconflow:
    api_base: "https://api.siliconflow.cn/v1/"
    default_model: "deepseek-ai/DeepSeek-V3.2"
    max_tokens: 163840
    api_key: ""
  google:
    api_base: "https://yunwu.zeabur.app/v1/"
    available_models:
      - "gemini-3-pro-preview"
    default_model: "gemini-3-pro-preview"
    max_tokens: 65536
    api_key: ""


# Project configuration
project:
  default_provider: "qwen" # Default model provider for the project
  temerature: 0.1          # Model temperature

# Path configuration
paths:
  data_path: "/home/user/data/driver_info" # Path to save static-analysis content
  logs_path: "/home/user/data/logs"        # Path to save logs
  device_code_path: "/home/user/data/device_code"  # Directory to save the final device code
  qemu_hw_fack_pci_path: "/home/user/qemu_8.2_linux_6.18/src/qemu-stable-8.2/hw/fake_pci" # Location where device code is saved in the QEMU project
  qemu_run_dir: "/home/user/qemu_8.2_linux_6.18/image" # Directory for running QEMU
  driver_name_case_mapping_path: "/home/user/data/qemu_config/qemu_config.json" # Driver-name case-mapping file
  qemu_kernel_bzImage_path: "/home/user/qemu_8.2_linux_6.18/src/linux-6.18-defconfig/arch/x86_64/boot/bzImage" # Kernel path used by QEMU
  qemu_image_path: "/home/user/qemu_8.2_linux_6.18/image/bullseye.img" # Image path used by QEMU
  qemu_log_path: "/home/user/qemu_8.2_linux_6.18/qemu.log" # QEMU log path
  qemu_out_share_path: "/home/user/qemu_8.2_linux_6.18/src/out/share" # QEMU shared directory path
  qemu_out_shares_path: "/home/user/qemu_8.2_linux_6.18/src/out/shares" # QEMU shared directory path
  qemu-system-x86_64_path: "/home/user/qemu_8.2_linux_6.18/src/qemu-stable-8.2/build/qemu-system-x86_64" # Path to the qemu-system-x86_64 executable
  qemu_rum_template_path: "/home/user/data/qemu_config/start_qemu_template.sh" # Path to the QEMU startup script template
  qemu_build_static_path: "/home/user/qemu_8.2_linux_6.18/src/qemu-stable-8.2/build_static" # QEMU static build path, used for clangd error checking
  qemu_build_path: "/home/user/qemu_8.2_linux_6.18/src/qemu-stable-8.2/build" # QEMU build path
  linux_path_prefix: "/home/user/桌面/linux_allyesconfig" # Linux source path prefix inside the static-analysis content
  step4_examples_path: "/home/user/data/step4_examples"   # Path to save repair examples for step 4
  db_path: "/home/user/vdm/driver_info.db"             # Database path
  qemu_build_sh_path: "/home/user/data/qemu_config/build_qemu.sh" # Path to the QEMU build script
  id_rsa_path: "/home/user/qemu_8.2_linux_6.18/image/bullseye.id_rsa" # Path to the private key used for remote login to QEMU
